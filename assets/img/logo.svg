    <path d="M22.3 40.4c6.2-5.4 13.2-8.6 19.4-7.9 1.3.14 1.9 1.6 1 2.5-5.6 5.6-12.6 9.4-19.6 8.6-1.35-.15-1.9-1.85-.8-2.7Z"
