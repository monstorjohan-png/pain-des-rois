  <!-- roundel -->
  <circle cx="32" cy="32" r="31" fill="url(#pdr-navy)"/>
  <circle cx="32" cy="32" r="30.4" fill="none" stroke="url(#pdr-gold)" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="26.6" fill="none" stroke="url(#pdr-gold)" stroke-width=".6" opacity=".5"/>

  <!-- crown -->
  <path d="M19 26.5l4.1 4.3 4.3-7.2 4.6 6.2 4.6-6.2 4.3 7.2 4.1-4.3-2 8.6H21l-2-8.6Z"
